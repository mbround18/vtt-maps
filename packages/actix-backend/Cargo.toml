[package]
name = "actix-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.20.3"
actix-web = "4.12.1"
actix-files = "0.6.9"
actix-cors = "0.7.1"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
glob = "0.3.3"
shared = { path = "../shared" }
meilisearch-sdk = "0.31.0"
anyhow = "1.0.100"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tracing-actix-web = "0.7.19"
pulldown-cmark = "0.13.0"
base64 = "0.22.1"
futures = "0.3.31"
kuchikiki = "0.8.8-speedreader"
futures-util = "0.3.31"
html5ever = "0.36.1"
bytes = "1.11.0"
actix-session = { version = "0.11.0", features = [
    "cookie-session",
    "redis-session",
] }
actix-identity = "0.9.0"
rand = "0.9.2"
chrono = { version = "0.4.42", features = ["clock"] }
redis = { version = "1.0.0", features = [
    "aio",
    "tokio-comp",
    "connection-manager",
] }
thiserror = "2.0.17"
diesel = { version = "2.3.4", features = [
    "postgres",
    "r2d2",
    "chrono",
    "uuid",
] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }
reqwest = { version = "0.12.25", features = ["json", "rustls-tls"] }
jsonwebtoken = "10.2.0"
uuid = { version = "1.19.0", features = ["v4"] }
dotenvy = "0.15.7"
